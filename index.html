<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Visor GRD — Exposición a Inundaciones</title>
<meta name="description" content="Visor de gestión del riesgo de desastres: huella de inundación Sentinel-1 (UN-SPIDER) y exposición de infraestructura vial (BID).">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.css">
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
<style>
  :root { --bg: #f8fafc; --panel: #ffffff; --borde: #e2e8f0; --texto: #0f172a; --sub: #64748b; --acento: #0284c7; }
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'IBM Plex Sans', sans-serif; }
  body { display: flex; flex-direction: column; height: 100vh; color: var(--texto); background: var(--bg); }
  .barra-sup { display: flex; justify-content: space-between; align-items: center; padding: 10px 16px; background: #0f172a; color: #fff; }
  .marca { display: flex; align-items: center; gap: 10px; }
  .marca h1 { font-size: 1rem; font-weight: 600; }
  .version { font-size: 0.72rem; background: #0284c7; padding: 2px 8px; border-radius: 99px; }
  .btn-volver { color: #e2e8f0; text-decoration: none; font-size: 0.82rem; display: flex; align-items: center; gap: 6px; border: 1px solid #334155; padding: 5px 10px; border-radius: 6px; }
  .btn-volver:hover { background: #1e293b; }
  .barra-ctrl { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; padding: 8px 16px; background: var(--panel); border-bottom: 1px solid var(--borde); }
  .selector-ciudad { display: flex; align-items: center; gap: 6px; border: 1px solid var(--borde); padding: 4px 10px; border-radius: 6px; font-size: 0.85rem; }
  .selector-ciudad select { border: none; background: transparent; font-weight: 500; outline: none; }
  .segmentado { display: flex; align-items: center; gap: 4px; background: #f1f5f9; padding: 3px; border-radius: 6px; }
  .segmentado button { border: none; background: transparent; padding: 4px 10px; font-size: 0.8rem; border-radius: 4px; cursor: pointer; color: var(--sub); }
  .segmentado button[aria-pressed="true"] { background: #fff; color: var(--texto); font-weight: 600; box-shadow: 0 1px 2px rgba(0,0,0,0.08); }
  .cuerpo { display: flex; flex: 1; overflow: hidden; }
  #panel { width: 340px; background: var(--panel); border-right: 1px solid var(--borde); display: flex; flex-direction: column; overflow-y: auto; padding: 14px; gap: 16px; }
  .seccion h2 { font-size: 0.85rem; font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em; color: var(--sub); margin-bottom: 10px; display: flex; align-items: center; gap: 6px; }
  .kpi-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
  .kpi-card { background: #f8fafc; border: 1px solid var(--borde); border-radius: 8px; padding: 10px; }
  .kpi-val { font-size: 1.25rem; font-weight: 600; color: #0f172a; }
  .kpi-lbl { font-size: 0.72rem; color: var(--sub); margin-top: 2px; }
  .capa-item { display: flex; align-items: center; justify-content: space-between; padding: 6px 0; font-size: 0.85rem; border-bottom: 1px solid #f1f5f9; cursor: pointer; }
  .barra-item { margin-bottom: 10px; }
  .barra-cab { display: flex; justify-content: space-between; font-size: 0.8rem; margin-bottom: 4px; }
  .barra-track { height: 8px; background: #f1f5f9; border-radius: 99px; overflow: hidden; }
  .barra-fill { height: 100%; border-radius: 99px; }
  .swatch { display: inline-block; width: 12px; height: 12px; border-radius: 3px; margin-right: 6px; vertical-align: middle; }
  .mapa-wrap { flex: 1; position: relative; }
  #map { width: 100%; height: 100%; }
  .panel-pie { margin-top: auto; font-size: 0.72rem; color: var(--sub); border-top: 1px solid var(--borde); padding-top: 10px; }
  @media (max-width: 768px) {
    .cuerpo { flex-direction: column-reverse; }
    #panel { width: 100%; height: 45%; border-right: none; border-top: 1px solid var(--borde); }
  }
</style>
</head>
<body>

<header class="barra-sup">
  <div class="marca">
    <span class="marca-icono"><i class="fa-solid fa-water"></i></span>
    <h1>Visor GRD — Exposición a Inundaciones</h1>
    <span class="version">Piloto v1.00</span>
  </div>
  <a href="https://github.com/promovilidad-mtc/piloto_grd-inundaciones" target="_blank" rel="noopener" class="btn-volver">
    <i class="fa-brands fa-github"></i> Repositorio
  </a>
</header>

<div class="barra-ctrl">
  <label class="selector-ciudad">
    <i class="fa-solid fa-location-dot" style="color:#0284c7"></i>
    <select id="sel-ciudad" aria-label="Ciudad">
      <option value="tumbes" selected>Tumbes (Evento Marzo 2023)</option>
      <option value="piura" disabled>Piura (Próximamente)</option>
      <option value="trujillo" disabled>Trujillo (Próximamente)</option>
    </select>
  </label>

  <div class="segmentado" role="group" aria-label="Modo de mapa">
    <button type="button" data-fondo="claro" aria-pressed="true">Claro</button>
    <button type="button" data-fondo="oscuro" aria-pressed="false">Oscuro</button>
    <button type="button" data-fondo="satelite" aria-pressed="false">Satélite</button>
    <button type="button" data-fondo="osm" aria-pressed="false">OSM</button>
  </div>
</div>

<main class="cuerpo">
  <aside id="panel" aria-label="Capas e indicadores GRD">
    <section class="seccion">
      <h2><i class="fa-solid fa-layer-group"></i> Capas espaciales</h2>
      <label class="capa-item">
        <span><span class="swatch" style="background:rgba(14,165,233,0.45); border:1px solid #0284c7;"></span>Huella inundación (Sentinel-1)</span>
        <input type="checkbox" id="chk-inundacion" checked>
      </label>
      <label class="capa-item">
        <span><span class="swatch" style="background:#d7191c;"></span>Red vial expuesta (OSM)</span>
        <input type="checkbox" id="chk-vias" checked>
      </label>
    </section>

    <section class="seccion">
      <h2><i class="fa-solid fa-chart-simple"></i> Indicadores de exposición</h2>
      <div class="kpi-grid">
        <div class="kpi-card">
          <div class="kpi-val" id="kpi-km">32.96 km</div>
          <div class="kpi-lbl">Red vial expuesta</div>
        </div>
        <div class="kpi-card">
          <div class="kpi-val" id="kpi-critica">0.55 km</div>
          <div class="kpi-lbl">Vía troncal (Trunk)</div>
        </div>
      </div>
      <div id="grafico-vias"></div>
    </section>

    <footer class="panel-pie">
      Metodología: Radar Sentinel-1 (UN-SPIDER / ONU) y Screening de Exposición (BID). Proyección: EPSG:32717.
    </footer>
  </aside>

  <div class="mapa-wrap">
    <div id="map" role="application" aria-label="Mapa de exposición a inundaciones"></div>
  </div>
</main>

<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.js"></script>
<script>
const SIMBOLOGIA_VIAS = {
  trunk:        { nombre: 'Troncal (Trunk)', color: '#d7191c', km: 0.55 },
  secondary:    { nombre: 'Secundaria',      color: '#fdae61', km: 0.12 },
  tertiary:     { nombre: 'Terciaria',       color: '#eab308', km: 0.41 },
  residential:  { nombre: 'Residencial',     color: '#2b83ba', km: 31.87 },
  unclassified: { nombre: 'No clasificada',  color: '#999999', km: 0.01 }
};

function renderizarGrafico() {
  const cont = document.getElementById('grafico-vias');
  const totalKm = Object.values(SIMBOLOGIA_VIAS).reduce((acc, v) => acc + v.km, 0);
  const ordenados = Object.entries(SIMBOLOGIA_VIAS).sort((a, b) => b[1].km - a[1].km);

  cont.innerHTML = ordenados.map(([clave, info]) => {
    const pct = ((info.km / totalKm) * 100).toFixed(1);
    return `
      <div class="barra-item">
        <div class="barra-cab">
          <span><span class="swatch" style="background:${info.color}"></span>${info.nombre}</span>
          <strong>${info.km.toFixed(2)} km (${pct}%)</strong>
        </div>
        <div class="barra-track">
          <div class="barra-fill" style="width:${Math.max(pct, 2)}%; background:${info.color}"></div>
        </div>
      </div>
    `;
  }).join('');
}

const map = L.map('map').setView([-3.565, -80.45], 13);

const fondos = {
  claro:    L.tileLayer('https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }),
  oscuro:   L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_all/{z}/{x}/{y}{r}.png', { attribution: '© CARTO' }),
  satelite: L.tileLayer('https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}', { attribution: '© Esri' }),
  osm:      L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', { attribution: '© OpenStreetMap' })
};
let fondoActivo = fondos.claro.addTo(map);

document.querySelectorAll('.segmentado button').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.segmentado button').forEach(b => b.setAttribute('aria-pressed', 'false'));
    btn.setAttribute('aria-pressed', 'true');
    map.removeLayer(fondoActivo);
    fondoActivo = fondos[btn.dataset.fondo].addTo(map);
  });
});

let capaInundacion = L.layerGroup().addTo(map);
let capaVias = L.layerGroup().addTo(map);

fetch('data/tumbes_mancha_inundacion.geojson')
  .then(r => r.json())
  .then(data => {
    const layerInund = L.geoJSON(data, {
      style: { color: '#0284c7', weight: 1, fillColor: '#0ea5e9', fillOpacity: 0.35 }
    }).addTo(capaInundacion);
    if (layerInund.getBounds().isValid()) {
      map.fitBounds(layerInund.getBounds());
    }
  }).catch(() => console.warn('No se encontró data/tumbes_mancha_inundacion.geojson'));

fetch('data/tumbes_vias_expuestas.geojson')
  .then(r => r.json())
  .then(data => {
    L.geoJSON(data, {
      style: feat => {
        const tipo = feat.properties.tipo_via || 'unclassified';
        const cfg = SIMBOLOGIA_VIAS[tipo] || SIMBOLOGIA_VIAS.unclassified;
        return { color: cfg.color, weight: tipo === 'trunk' ? 4 : 2.5, opacity: 0.95 };
      },
      onEachFeature: (feat, layer) => {
        const p = feat.properties;
        const nombre = Array.isArray(p.name) ? p.name.join(' / ') : (p.name || 'Vía sin nombre');
        layer.bindPopup(`<strong>${nombre}</strong><br>Tipo: ${p.tipo_via}<br>Tramo expuesto: ${Number(p.longitud_m).toFixed(1)} m`);
      }
    }).addTo(capaVias);
  }).catch(() => console.warn('No se encontró data/tumbes_vias_expuestas.geojson'));

document.getElementById('chk-inundacion').addEventListener('change', e => {
  e.target.checked ? map.addLayer(capaInundacion) : map.removeLayer(capaInundacion);
});
document.getElementById('chk-vias').addEventListener('change', e => {
  e.target.checked ? map.addLayer(capaVias) : map.removeLayer(capaVias);
});

renderizarGrafico();
</script>
</body>
</html>
